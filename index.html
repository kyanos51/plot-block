<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="플롯블록">
  <meta name="theme-color" content="#F4F1EA">
  <title>플롯 블록</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <input class="search" placeholder="화수 검색" inputmode="numeric" id="search">
    <button class="bar-btn" id="btn-undo" hidden disabled>되돌리기</button>
    <button class="bar-btn" id="btn-edit">편집</button>
    <button class="bar-btn" data-soon>글</button>
    <button class="bar-btn" data-soon>터뜨리기</button>
  </header>

  <main class="timeline" id="timeline"></main>

  <div class="tray" id="tray"></div>
  <div class="drag-layer" id="drag-layer"></div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
