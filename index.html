<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="플롯블록">
  <meta name="theme-color" content="#F4F1EA">
  <title>플롯 블록</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="appbar">
    <input class="search" placeholder="화수 검색" inputmode="numeric" id="search">
    <button class="bar-btn" id="btn-undo" hidden disabled>되돌리기</button>
    <button class="bar-btn" id="btn-edit">편집</button>
    <button class="bar-btn" id="btn-text">글</button>
    <button class="bar-btn" id="btn-pop">터뜨리기</button>
  </header>

  <main class="timeline" id="timeline"></main>

  <div class="tray" id="tray"></div>
  <svg class="link-svg" id="link-svg"></svg>
  <canvas class="fx" id="fx"></canvas>
  <div class="chain-count" id="chain-count"></div>
  <div class="combo" id="combo" hidden><span class="combo-num-wrap"><span class="combo-num" data-text="1">1</span></span><span class="combo-label" data-text="COMBO">COMBO</span><span class="combo-blocks"></span></div>
  <div class="drag-layer" id="drag-layer"></div>
  <div class="palette" id="palette" hidden>
    <div class="palette-head"><b>색 슬롯</b><button id="palette-close">닫기</button></div>
    <div id="palette-rows"></div>
    <p class="palette-hint">색을 누르면 바꿀 수 있고, 그 색을 쓰는 블록이 모두 함께 바뀝니다. 트레이 색을 다른 색 블록 위에 놓으면 그 블록만 색이 바뀝니다.</p>
  </div>

  <section class="memo" id="memo" hidden>
    <header class="memo-head">
      <button class="memo-back" id="memo-back">‹ 시트</button>
      <span class="memo-chip"></span>
      <input class="memo-meaning" id="memo-meaning" placeholder="색 의미 (예: 복선)">
      <button class="memo-copy" id="memo-copy">전체 복사</button>
    </header>
    <div class="memo-list" id="memo-list"></div>
  </section>

  <div class="sheet-panel" id="text-editor" hidden>
    <div class="panel-head"><b>요약 메모</b><button id="text-done">완료</button></div>
    <input class="panel-input" id="text-input" maxlength="24" placeholder="짧은 제목 (예: 첫 만남)" enterkeyhint="done">
    <div class="panel-row">
      <button class="panel-btn" id="text-clear">지우기</button>
      <button class="panel-btn" id="text-inside" hidden>블록 안으로</button>
    </div>
    <p class="panel-hint">글 모드에서 메모를 끌어 블록의 위·아래·왼쪽·오른쪽 빈칸에 말풍선으로 붙이거나, 자기 블록 위에 놓아 안으로 되돌릴 수 있습니다.</p>
  </div>

  <div class="sheet-panel" id="sheet-info" hidden>
    <div class="panel-head"><b>시트 정보</b><button id="sheet-done">완료</button></div>
    <div class="panel-row range">
      <input class="panel-input" id="sheet-from" type="number" inputmode="numeric" min="1" placeholder="시작">
      <span>~</span>
      <input class="panel-input" id="sheet-to" type="number" inputmode="numeric" min="1" placeholder="끝 (비우면 한 화)">
      <span>화</span>
    </div>
    <textarea class="panel-input" id="sheet-memo" rows="4" placeholder="이 구간의 메모"></textarea>
    <div class="panel-row"><button class="panel-btn danger" id="sheet-delete">시트 삭제</button></div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
