<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>색상 비교</title>
  <style>
    :root {
      --bg: #F4F1EA;
      --ink: #3B3833;
      --sub: #8A847A;
      --panel: rgba(255, 255, 255, 0.72);
      --cell: 52px;
      --gap: 6px;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.25s, color 0.25s;
    }
    body.dark { --ink: #EDE8DF; --sub: #A39C91; --panel: rgba(255, 255, 255, 0.08); }

    .controls {
      position: sticky; top: 0; z-index: 5;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
      background: var(--bg);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
      transition: background 0.25s;
    }
    .controls h1 { margin: 0 0 8px; font-size: 16px; }
    .label { font-size: 11px; color: var(--sub); margin: 8px 0 4px; }
    .tabs { display: flex; gap: 6px; }
    .tabs button {
      flex: 1; padding: 8px 4px; border-radius: 9px;
      border: 1.5px solid transparent; background: var(--panel); color: var(--ink);
      font: inherit; font-size: 12px; touch-action: manipulation;
    }
    .tabs button.on { border-color: var(--ink); font-weight: 700; }
    .tabs .sw { display: block; height: 14px; border-radius: 4px; margin-bottom: 4px; }
    .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 8px; }

    main { padding: 12px 16px 40px; max-width: 520px; margin: 0 auto; }
    main.gray .block { filter: grayscale(1); }
    main.edge .block { box-shadow: inset 0 0 0 1px rgba(60, 45, 30, 0.14), inset 0 -3px 0 rgba(0, 0, 0, 0.08); }

    /* 시트: 격자선 없음, 라벨만 */
    .sheet { margin-bottom: 18px; }
    .sheet-label { font-size: 12px; font-weight: 700; color: var(--sub); margin: 0 0 6px 2px; }
    .grid {
      position: relative;
      width: calc(var(--cell) * 5 + var(--gap) * 4);
      height: calc(var(--cell) * 3 + var(--gap) * 2);
      margin: 0 auto;
    }
    .block {
      position: absolute;
      width: var(--cell); height: var(--cell);
      border-radius: 9px;
      background: var(--c);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.08);
      display: flex; align-items: center; justify-content: center;
      padding: 3px; text-align: center;
      font-size: 10px; line-height: 1.2; font-weight: 600;
      color: rgba(40, 36, 30, 0.82);
      word-break: keep-all;
    }
    .note {
      position: absolute;
      width: calc(var(--cell) * 2 + var(--gap));
      font-size: 10px; line-height: 1.3; color: var(--ink);
      padding: 4px 2px;
    }

    .card {
      background: var(--panel); border-radius: 14px; padding: 14px; margin-top: 8px;
      font-size: 13px;
    }
    .card h2 { font-size: 14px; margin: 0 0 8px; }
    .chips { display: flex; gap: 10px; }
    .chip { flex: 1; text-align: center; font-size: 11px; color: var(--sub); }
    .chip label {
      display: block; aspect-ratio: 1; border-radius: 10px; background: var(--c);
      position: relative; overflow: hidden; margin-bottom: 4px;
    }
    .chip input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
    .btn {
      width: 100%; margin-top: 10px; padding: 12px; border: 0; border-radius: 10px;
      background: var(--ink); color: var(--bg); font: inherit; font-weight: 700; font-size: 14px;
      touch-action: manipulation;
    }
    .hint { font-size: 11px; color: var(--sub); line-height: 1.5; margin: 8px 0 0; }
    textarea {
      width: 100%; min-height: 60px; margin-top: 8px; border-radius: 10px; border: 0;
      padding: 10px; font: inherit; font-size: 16px; background: rgba(255, 255, 255, 0.9); color: #3B3833;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h1>색상 비교 <small style="font-weight:400;color:var(--sub);font-size:11px">Phase 1</small></h1>
    <div class="label">블록 색 세트</div>
    <div class="tabs" id="palette-tabs"></div>
    <div class="label">배경색</div>
    <div class="tabs" id="bg-tabs"></div>
    <label class="toggle"><input type="checkbox" id="gray"> 흑백으로 보기 (명도 차이 확인)</label>
    <label class="toggle"><input type="checkbox" id="edge"> 블록 외곽선 (색은 그대로, 테두리만 추가)</label>
  </div>

  <main id="preview"></main>

  <main>
    <section class="card">
      <h2>현재 세트 색 조정</h2>
      <div class="chips" id="chips"></div>
      <p class="hint">색 칸을 누르면 직접 바꿀 수 있습니다.</p>
    </section>
    <section class="card">
      <h2>결과 보내기</h2>
      <textarea id="memo" placeholder="느낀 점 (예: B 세트가 좋은데 노랑이 너무 진함)"></textarea>
      <button class="btn" id="copy">결과 복사</button>
      <p class="hint" id="msg"></p>
    </section>
  </main>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const CELL = 52, GAP = 6, STEP = CELL + GAP;

    const palettes = [
      { name: '내 선택', colors: ['#F8DCD6', '#C09084', '#C0D4EE', '#FBE6C6'] },
      { name: 'B1 살짝', colors: ['#F2CCC3', '#C79C90', '#C0D4EE', '#F6DCAE'] },
      { name: 'B2 확실히', colors: ['#EDBFB4', '#C79C90', '#C0D4EE', '#F2D29A'] },
    ];
    const backgrounds = [
      { name: '아이보리', c: '#F4F1EA' },
      { name: '웜그레이', c: '#E9E6E0' },
      { name: '블루', c: '#E7ECF1' },
      { name: '크래프트', c: '#EDE3D1' },
      { name: '차콜', c: '#2F2D2B', dark: true },
    ];

    // 예시 플롯: [색 번호, 열, 행, 블록 안 텍스트]
    const sheets = [
      { label: '1~17화', blocks: [[0, 0, 1, '첫 만남'], [1, 2, 1, '복선'], [3, 4, 0, '']],
        note: { col: 1, row: 2, text: '주인공 등장, 세계관 소개' } },
      { label: '18화', blocks: [[2, 1, 1, '배신'], [0, 3, 1, '재회'], [1, 3, 2, '']],
        note: { col: 0, row: 0, text: '분위기 반전' } },
      { label: '19~30화', blocks: [[3, 0, 1, '수련'], [2, 2, 0, ''], [0, 4, 1, '고백'], [1, 2, 2, '회수']],
        note: null },
    ];

    const state = { p: 0, bg: 0 };

    function renderTabs() {
      $('palette-tabs').innerHTML = palettes.map((p, i) => `
        <button class="${i === state.p ? 'on' : ''}" data-i="${i}">
          <span class="sw" style="background:linear-gradient(90deg,${p.colors.map((c, k) => `${c} ${k * 25}% ${(k + 1) * 25}%`).join(',')})"></span>
          ${p.name}
        </button>`).join('');
      $('bg-tabs').innerHTML = backgrounds.map((b, i) => `
        <button class="${i === state.bg ? 'on' : ''}" data-i="${i}">
          <span class="sw" style="background:${b.c};box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)"></span>
          ${b.name}
        </button>`).join('');
    }

    function renderPreview() {
      const colors = palettes[state.p].colors;
      $('preview').innerHTML = sheets.map((s) => `
        <section class="sheet">
          <p class="sheet-label">${s.label}</p>
          <div class="grid">
            ${s.blocks.map(([ci, col, row, t]) =>
              `<div class="block" style="--c:${colors[ci]};left:${col * STEP}px;top:${row * STEP}px">${t}</div>`).join('')}
            ${s.note ? `<div class="note" style="left:${s.note.col * STEP}px;top:${s.note.row * STEP}px">${s.note.text}</div>` : ''}
          </div>
        </section>`).join('');
    }

    function renderChips() {
      $('chips').innerHTML = palettes[state.p].colors.map((c, i) => `
        <div class="chip">
          <label style="--c:${c}"><input type="color" value="${c}" data-i="${i}"></label>
          ${c}
        </div>`).join('');
    }

    function applyBg() {
      const b = backgrounds[state.bg];
      document.documentElement.style.setProperty('--bg', b.c);
      document.body.classList.toggle('dark', !!b.dark);
    }

    function render() { renderTabs(); renderPreview(); renderChips(); applyBg(); }

    $('palette-tabs').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      state.p = +b.dataset.i; render();
    });
    $('bg-tabs').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      state.bg = +b.dataset.i; render();
    });
    $('edge').addEventListener('change', (e) => $('preview').classList.toggle('edge', e.target.checked));
    $('gray').addEventListener('change', (e) => $('preview').classList.toggle('gray', e.target.checked));
    $('chips').addEventListener('input', (e) => {
      if (e.target.type !== 'color') return;
      palettes[state.p].colors[+e.target.dataset.i] = e.target.value.toUpperCase();
      renderTabs(); renderPreview();
      e.target.parentElement.style.setProperty('--c', e.target.value);
      e.target.parentElement.nextSibling.textContent = e.target.value.toUpperCase();
    });

    $('copy').addEventListener('click', async () => {
      const p = palettes[state.p], b = backgrounds[state.bg];
      const lines = [
        '[Phase 1 색상 선택]',
        `블록 세트: ${p.name} (${p.colors.join(', ')})`,
        `배경: ${b.name} (${b.c})`,
      ];
      const memo = $('memo').value.trim();
      if (memo) lines.push(`메모: ${memo}`);
      const text = lines.join('\n');
      try {
        await navigator.clipboard.writeText(text);
        $('msg').textContent = '복사했습니다. 대화창에 붙여 넣어 주세요.';
      } catch {
        $('memo').value = text; $('memo').select();
        $('msg').textContent = '위 칸의 내용을 직접 복사해 주세요.';
      }
    });

    render();
  </script>
</body>
</html>
